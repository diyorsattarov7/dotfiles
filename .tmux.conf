set -g prefix C-b
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

set-window-option -g mode-keys vi
set -g mouse on

set-option -g allow-rename off
set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh

bind | split-window -h
bind - split-window -v
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# GitHub Dark theme
set -g status-style "bg=#0E1116,fg=#C9D1D9"
set -g status-left-style "fg=#79C0FF"
set -g status-right-style "fg=#8B949E"

set -g window-status-style "fg=#8B949E"
set -g window-status-current-style "fg=#7EE787,bold"

set -g pane-border-style "fg=#30363D"
set -g pane-active-border-style "fg=#79C0FF"

set -g message-style "bg=#161B22,fg=#C9D1D9"
set -g mode-style "bg=#30363D,fg=#C9D1D9"

set -g status-left " #S "
set -g status-right " %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
