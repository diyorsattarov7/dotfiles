set -g prefix C-b
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

set-window-option -g mode-keys vi
set -g mouse on

set-option -g allow-rename off
set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh

bind | split-window -h
bind - split-window -v
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

# GitHub Dark Colorblind theme
set -g status-style "bg=#0E1116,fg=#C9D1D9"

# Session name
set -g status-left-style "fg=#79C0FF"
set -g status-left '#[fg=#79C0FF] #S '

# Clock
set -g status-right-style "fg=#C9D1D9"
set -g status-right '#[fg=#C9D1D9] %H:%M '

# Tabs
set -g window-status-style "fg=#D2A8FF,bg=#0E1116"
set -g window-status-current-style "fg=#F0883E,bg=#0E1116,bold"
set -g window-status-format '#[fg=#D2A8FF] #I:#W '
set -g window-status-current-format '#[fg=#F0883E,bold] #I:#W '
set -g window-status-separator ''

# Pane borders
set -g pane-border-style "fg=#30363D"
set -g pane-active-border-style "fg=#79C0FF"

# Messages and copy mode
set -g message-style "bg=#161B22,fg=#F0883E"
set -g mode-style "bg=#F0883E,fg=#0E1116,bold"
